<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B4FE9"/>
      <stop offset="100%" stop-color="#9B5DE5"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C9A7"/>
      <stop offset="100%" stop-color="#5B4FE9"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#FFB84C"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#241E38"/>
    </marker>
  </defs>

  <rect width="900" height="340" fill="#FBFAFF"/>
  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#241E38">Study Buddy — System Architecture</text>

  <!-- Front-end -->
  <rect x="40" y="110" width="220" height="120" rx="18" fill="url(#g1)"/>
  <text x="150" y="155" text-anchor="middle" fill="white" font-size="17" font-weight="700">Front-End</text>
  <text x="150" y="178" text-anchor="middle" fill="white" font-size="12">HTML / CSS / JS</text>
  <text x="150" y="196" text-anchor="middle" fill="white" font-size="12">Chat UI, history,</text>
  <text x="150" y="212" text-anchor="middle" fill="white" font-size="12">loading state</text>

  <!-- Back-end -->
  <rect x="340" y="110" width="220" height="120" rx="18" fill="url(#g2)"/>
  <text x="450" y="150" text-anchor="middle" fill="white" font-size="17" font-weight="700">Back-End</text>
  <text x="450" y="172" text-anchor="middle" fill="white" font-size="12">FastAPI (Python)</text>
  <text x="450" y="190" text-anchor="middle" fill="white" font-size="12">POST /api/chat</text>
  <text x="450" y="208" text-anchor="middle" fill="white" font-size="12">Session store · sanitisation</text>

  <!-- LLM API -->
  <rect x="640" y="110" width="220" height="120" rx="18" fill="url(#g3)"/>
  <text x="750" y="155" text-anchor="middle" fill="white" font-size="17" font-weight="700">LLM API</text>
  <text x="750" y="178" text-anchor="middle" fill="white" font-size="12">Anthropic Claude</text>
  <text x="750" y="196" text-anchor="middle" fill="white" font-size="12">(or OpenAI)</text>
  <text x="750" y="212" text-anchor="middle" fill="white" font-size="12">system + message turns</text>

  <!-- Arrows -->
  <line x1="260" y1="150" x2="336" y2="150" stroke="#241E38" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="298" y="140" text-anchor="middle" font-size="11" fill="#241E38">JSON request</text>

  <line x1="336" y1="190" x2="260" y2="190" stroke="#241E38" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="298" y="205" text-anchor="middle" font-size="11" fill="#241E38">reply text</text>

  <line x1="560" y1="150" x2="636" y2="150" stroke="#241E38" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="598" y="140" text-anchor="middle" font-size="11" fill="#241E38">messages[]</text>

  <line x1="636" y1="190" x2="560" y2="190" stroke="#241E38" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="598" y="205" text-anchor="middle" font-size="11" fill="#241E38">completion</text>

  <text x="450" y="285" text-anchor="middle" font-size="12" fill="#4B4460">Browser (client) ⇄ FastAPI server (Docker container) ⇄ Hosted LLM provider</text>
  <text x="450" y="305" text-anchor="middle" font-size="12" fill="#4B4460">Conversation history kept server-side, keyed by session_id, per assessment requirement C.</text>
</svg>
